name: Feature request
description: Suggest an idea for Inquiso
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Alignment
      options:
        - label: This keeps Inquiso serverless, local-first, and ToS-honest (see docs/00-vision.md)
          required: true
