<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expensely — Expense Reports</title>
<style>
  :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
  body { max-width: 720px; margin: 0 auto; padding: 0 1rem 3rem; }
  header { display: flex; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid #8884; }
  header .brand { font-weight: 700; margin-right: auto; }
  form { display: grid; gap: .9rem; margin-top: 1.25rem; max-width: 460px; }
  label { display: grid; gap: .25rem; font-size: .92rem; }
  input, select { padding: .45rem; border: 1px solid #8886; border-radius: 8px; font: inherit; background: transparent; }
  .row { display: flex; gap: .6rem; }
  button.primary { background: #2563eb; color: white; border: none; border-radius: 8px; padding: .5rem 1rem; cursor: pointer; }
  button.ghost { background: #8882; border: none; border-radius: 8px; padding: .5rem 1rem; cursor: pointer; }
  #reports { margin-top: 2rem; }
  .report { border: 1px solid #8884; border-radius: 8px; padding: .6rem .8rem; margin: .4rem 0; }
  .report .status { font-size: .8rem; opacity: .75; }
  #toast { position: fixed; bottom: 1rem; right: 1rem; background: #16a34a; color: white; padding: .5rem .9rem; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <span class="brand">Expensely</span>
  <a href="../">demo hub</a>
</header>

<h1>New expense report</h1>
<form id="form">
  <label>Report name
    <input id="name" name="name" placeholder="e.g. July invoice" required />
  </label>
  <label>Receipt / invoice file
    <input id="file" name="file" type="file" />
  </label>
  <label>Category
    <select id="category" name="category">
      <option value="">Choose a category…</option>
      <option>Software & subscriptions</option>
      <option>Travel</option>
      <option>Office</option>
    </select>
  </label>
  <label>Amount (USD)
    <input id="amount" name="amount" type="number" step="0.01" min="0" placeholder="0.00" />
  </label>
  <div class="row">
    <button type="button" class="ghost" id="draft">Save draft</button>
    <button type="submit" class="primary" id="submit">Submit report</button>
  </div>
</form>

<section id="reports" aria-live="polite">
  <h2>Submitted reports</h2>
  <div id="list"></div>
</section>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s)
const load = () => JSON.parse(localStorage.getItem('expenseReports') || '[]')
const save = (list) => localStorage.setItem('expenseReports', JSON.stringify(list))
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'
  setTimeout(() => { t.style.display = 'none' }, 2500)
}

function render() {
  const list = load()
  $('#list').innerHTML = list.length === 0
    ? '<p>No reports yet.</p>'
    : list.map((r) => `
        <div class="report">
          <strong>${r.name}</strong> — ${r.category || 'uncategorized'} — $${r.amount || '0.00'}
          ${r.file ? `— <em>${r.file}</em>` : ''}
          <div class="status">${r.status} · ${r.at}</div>
        </div>`).join('')
}

function collect(status) {
  return {
    name: $('#name').value.trim(),
    file: $('#file').files[0]?.name || '',
    category: $('#category').value,
    amount: $('#amount').value,
    status,
    at: new Date().toISOString().slice(0, 16).replace('T', ' '),
  }
}

$('#draft').addEventListener('click', () => {
  const r = collect('draft')
  if (!r.name) { toast('Name required'); return }
  save([r, ...load()])
  document.title = 'Expensely — draft saved'
  toast('Draft saved')
  render()
})

$('#form').addEventListener('submit', (e) => {
  e.preventDefault()
  const r = collect('submitted')
  // Submission is consequential: the portal itself demands confirmation.
  if (!window.confirm(`Submit expense report "${r.name}"?`)) return
  save([r, ...load()])
  document.title = 'Expensely — report submitted'
  toast('Report submitted')
  e.target.reset()
  render()
})

render()
</script>
</body>
</html>
