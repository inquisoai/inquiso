<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acme Invoicing</title>
<style>
  :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
  body { max-width: 860px; margin: 0 auto; padding: 0 1rem 3rem; }
  header { display: flex; gap: 1rem; align-items: center; padding: 1rem 0; border-bottom: 1px solid #8884; }
  header .brand { font-weight: 700; margin-right: auto; }
  nav a, nav button { background: none; border: none; font: inherit; color: #2563eb; cursor: pointer; text-decoration: none; padding: .25rem .5rem; }
  main { padding-top: 1.25rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #8883; }
  button.primary { background: #2563eb; color: white; border: none; border-radius: 8px; padding: .45rem .9rem; cursor: pointer; }
  button.ghost { background: #8882; border: none; border-radius: 8px; padding: .4rem .8rem; cursor: pointer; }
  .pager { display: flex; gap: .5rem; align-items: center; margin-top: .75rem; }
  .banner { background: #8881; border: 1px solid #8884; border-radius: 8px; padding: .5rem .75rem; margin-bottom: 1rem; font-size: .9rem; }
  select { padding: .3rem; }
  #toast { position: fixed; bottom: 1rem; right: 1rem; background: #16a34a; color: white; padding: .5rem .9rem; border-radius: 8px; display: none; }
</style>
</head>
<body>
<header>
  <span class="brand">Acme Invoicing</span>
  <label>Account:
    <select id="account" aria-label="Account">
      <option>Town Web (default)</option>
      <option>Personal</option>
    </select>
  </label>
  <nav id="nav" aria-label="Main navigation"></nav>
</header>
<main id="main" aria-live="polite"></main>
<div id="toast" role="status"></div>

<script>
const VERSION = localStorage.getItem('portalNavVersion') || '1'
const INVOICES = Array.from({ length: 23 }, (_, i) => {
  const n = 23 - i
  const month = ((n - 1) % 12) + 1
  return {
    id: `INV-2026-${String(n).padStart(3, '0')}`,
    date: `2026-${String(month).padStart(2, '0')}-15`,
    amount: `$${(180 + n * 7).toFixed(2)}`,
  }
})
const PAGE_SIZE = 8
let page = 0

const $ = (s) => document.querySelector(s)
const toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block'
  setTimeout(() => { t.style.display = 'none' }, 2500)
}

// Version 1 hides Billing under Settings; version 2 moves it under Account
// (the stale-memory demo: a learned "Settings → Billing" path breaks in v2).
const NAV = VERSION === '1'
  ? [['Home', home], ['Reports', reports], ['Settings', settings]]
  : [['Home', home], ['Reports', reports], ['Account', accountMenu]]

function renderNav() {
  const nav = $('#nav'); nav.innerHTML = ''
  for (const [label, view] of NAV) {
    const b = document.createElement('button')
    b.textContent = label
    b.addEventListener('click', () => { view(); document.title = `Acme Invoicing — ${label}` })
    nav.appendChild(b)
  }
}

function home() {
  $('#main').innerHTML = `
    <div class="banner">Navigation version ${VERSION} — change it on the <a href="../">demo hub</a>.</div>
    <h1>Welcome back</h1>
    <p>Your workspace is <strong>Town Web</strong>. Use the navigation to manage the account.</p>`
}

function reports() {
  $('#main').innerHTML = `<h1>Reports</h1><p>Usage reports are empty in this demo. Invoices live under Billing.</p>`
}

function settings() {
  $('#main').innerHTML = VERSION === '1'
    ? `<h1>Settings</h1>
       <p>Workspace preferences.</p>
       <button class="primary" id="to-billing">Billing</button>`
    : `<h1>Settings</h1><p>Nothing here anymore — billing moved to the Account menu.</p>`
  const b = $('#to-billing'); if (b) b.addEventListener('click', billing)
}

function accountMenu() {
  $('#main').innerHTML = `
    <h1>Account</h1>
    <p>Account management.</p>
    <button class="primary" id="to-billing">Billing</button>`
  $('#to-billing').addEventListener('click', billing)
}

function download(kind, invoice) {
  const content = kind === 'pdf'
    ? `%PDF-1.4 demo invoice ${invoice.id} amount ${invoice.amount}`
    : `id,date,amount\n${invoice.id},${invoice.date},${invoice.amount}`
  const blob = new Blob([content], { type: kind === 'pdf' ? 'application/pdf' : 'text/csv' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = `${invoice.id}.${kind}`
  a.click()
  URL.revokeObjectURL(a.href)
  toast(`Downloaded ${invoice.id}.${kind}`)
  document.title = `Acme Invoicing — downloaded ${invoice.id}`
}

function billing() {
  document.title = 'Acme Invoicing — Billing'
  const rows = INVOICES.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)
  $('#main').innerHTML = `
    <h1>Billing</h1>
    <p>Invoices for Town Web, newest first. The table is paginated (${PAGE_SIZE} per page).</p>
    <table aria-label="Invoices">
      <thead><tr><th>Invoice</th><th>Date</th><th>Amount</th><th>Download</th></tr></thead>
      <tbody>
        ${rows.map((inv, i) => `
          <tr>
            <td>${inv.id}${page === 0 && i === 0 ? ' <strong>(newest)</strong>' : ''}</td>
            <td>${inv.date}</td><td>${inv.amount}</td>
            <td>
              <button class="ghost" data-pdf="${inv.id}" aria-label="Download ${inv.id} as PDF">PDF</button>
              <button class="ghost" data-csv="${inv.id}" aria-label="Download ${inv.id} as CSV">CSV</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="pager">
      <button class="ghost" id="prev" ${page === 0 ? 'disabled' : ''}>Previous</button>
      <span>Page ${page + 1} / ${Math.ceil(INVOICES.length / PAGE_SIZE)}</span>
      <button class="ghost" id="next" ${(page + 1) * PAGE_SIZE >= INVOICES.length ? 'disabled' : ''}>Next</button>
    </div>`
  $('#prev').addEventListener('click', () => { page -= 1; billing() })
  $('#next').addEventListener('click', () => { page += 1; billing() })
  for (const b of document.querySelectorAll('[data-pdf]')) {
    b.addEventListener('click', () => download('pdf', INVOICES.find((x) => x.id === b.dataset.pdf)))
  }
  for (const b of document.querySelectorAll('[data-csv]')) {
    b.addEventListener('click', () => download('csv', INVOICES.find((x) => x.id === b.dataset.csv)))
  }
}

renderNav()
home()
</script>
</body>
</html>
